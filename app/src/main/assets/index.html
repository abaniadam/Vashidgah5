<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#101316" media="(prefers-color-scheme: dark)">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#464e58;--bd:#e3e6ea;--ac:#0f766e;--acb:#d9f2ee;--rd:#d92d20;--rdb:#fdecea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
:root[data-season="spring"]{--bg:#f1f8f1;--ac:#2a8a4a;--acb:#d6efdc;--bd:#d9e8d9}
:root[data-season="summer"]{--bg:#fdf1f0;--ac:#c0392b;--acb:#f8d4d0;--bd:#efd6d3}
:root[data-season="autumn"]{--bg:#fff4e8;--ac:#d9650a;--acb:#fdddb8;--bd:#f2dcc2}
:root[data-season="winter"]{--bg:#f4f5f6;--ac:#5b6670;--acb:#e3e6e9;--bd:#dcdfe2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101316;--card:#1a1f24;--tx:#eceff3;--mu:#bcc5d0;--bd:#2c333a;--ac:#2dd4bf;--acb:#12403c;--rd:#ff6b5e;--rdb:#3a1b19;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101316;--card:#1a1f24;--tx:#eceff3;--mu:#bcc5d0;--bd:#2c333a;--ac:#2dd4bf;--acb:#12403c;--rd:#ff6b5e;--rdb:#3a1b19;color-scheme:dark}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"])[data-season="spring"]{--bg:#0f1712;--card:#17211a;--bd:#263629;--ac:#6ee08f;--acb:#16422a}
:root:not([data-theme="light"])[data-season="summer"]{--bg:#1a1010;--card:#241616;--bd:#3d2626;--ac:#ff7b6b;--acb:#4a1c18}
:root:not([data-theme="light"])[data-season="autumn"]{--bg:#1a120a;--card:#241910;--bd:#3d2a18;--ac:#ff9a3c;--acb:#4d2c0c}
:root:not([data-theme="light"])[data-season="winter"]{--bg:#141517;--card:#1d1f21;--bd:#303337;--ac:#b8c0c8;--acb:#2c3136}}
:root[data-theme="dark"][data-season="spring"]{--bg:#0f1712;--card:#17211a;--bd:#263629;--ac:#6ee08f;--acb:#16422a}
:root[data-theme="dark"][data-season="summer"]{--bg:#1a1010;--card:#241616;--bd:#3d2626;--ac:#ff7b6b;--acb:#4a1c18}
:root[data-theme="dark"][data-season="autumn"]{--bg:#1a120a;--card:#241910;--bd:#3d2a18;--ac:#ff9a3c;--acb:#4d2c0c}
:root[data-theme="dark"][data-season="winter"]{--bg:#141517;--card:#1d1f21;--bd:#303337;--ac:#b8c0c8;--acb:#2c3136}

html,body{height:100%;overscroll-behavior:none}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 Vazirmatn,Roboto,Tahoma,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;transition:background .3s}
*{box-sizing:border-box}
button,select,input,textarea{font:inherit;color:var(--tx);touch-action:manipulation}
button{cursor:pointer}
#app{height:100%;display:flex;flex-direction:column;max-width:640px;margin:0 auto;position:relative}
.bar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--bd)}
.logo{width:40px;height:40px;border-radius:12px;flex:none;cursor:zoom-in}
.bname{display:flex;flex-direction:column;line-height:1.2}.bname b{font-size:18px;font-weight:800}.bname small{font-size:11.5px;color:var(--mu)}
.ss{font-size:12px;font-weight:600;color:var(--ac);background:var(--acb);border-radius:999px;padding:3px 10px;white-space:nowrap}
.sp{flex:1}
.btn{min-height:44px;min-width:44px;background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:6px 14px}
.btn:active{border-color:var(--ac);filter:brightness(.95)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{color:#06201d}}
:root[data-theme="dark"] .btn.pri{color:#06201d}
.btn.dan{color:var(--rd)}
.btn.tdy{color:var(--ac);border-color:var(--ac);font-weight:800;transition:background .2s,color .2s}
.btn.tdy.away{background:var(--ac);border-color:var(--ac);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.tdy.away{color:#06201d}}
:root[data-theme="dark"] .btn.tdy.away{color:#06201d}
.btn.a{background:var(--acb);border-color:var(--ac)}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:12px 12px 96px;-webkit-overflow-scrolling:touch}
.clk{display:flex;align-items:center;justify-content:center;gap:16px;background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:10px 16px;margin-bottom:10px}
.ck{width:96px;height:96px;flex:none}
.ck .face{fill:var(--bg);stroke:var(--ac);stroke-width:3}
.ck .t{stroke:var(--mu);stroke-width:.8}.ck .T{stroke:var(--tx);stroke-width:1.8}
.ck text{fill:var(--tx);font-size:9px;font-weight:700;text-anchor:middle;dominant-baseline:central;font-family:inherit}
.ck .kh{stroke:var(--tx);stroke-width:4.6;stroke-linecap:round}.ck .km{stroke:var(--ac);stroke-width:3;stroke-linecap:round}
.ck .ks{stroke:var(--rd);stroke-width:1.4;stroke-linecap:round}.ck .kc{fill:var(--rd)}
.ci{flex:none;min-width:0;text-align:center}.dg{font-size:30px;font-weight:800;line-height:1.35;color:var(--ac);font-variant-numeric:tabular-nums}
.cdt{font-size:14px;font-weight:700}
.tv{background:linear-gradient(135deg,var(--acb),var(--card));border:1.5px solid var(--ac);border-radius:22px;padding:12px 14px;margin-bottom:10px;text-align:center}
.tv .tl{font-size:15px;font-weight:800}.tv .tt{font-size:30px;font-weight:800;color:var(--ac);line-height:1.4}
.rb{font-size:12px;color:var(--ac);margin:-2px 0 6px}
.rp{display:flex;flex-wrap:wrap;align-items:center;gap:0 14px;margin:2px 0 8px;font-size:14px}
.rp label{display:flex;align-items:center;gap:6px;min-height:44px}.rp input{width:22px;height:22px;accent-color:var(--ac);margin:0}
.nb{display:flex;align-items:center;gap:12px;width:100%;text-align:right;background:var(--acb);border:1.5px solid var(--ac);border-radius:18px;padding:10px 14px;margin-bottom:10px;font-size:14px;line-height:1.7}
.nb .nbi{font-size:24px}.note .row{flex-wrap:wrap}
.mh{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.mh .t{flex:1;background:none;border:0;text-align:center;border-radius:16px;padding:2px 4px}
.mh .t b{display:block;font-size:25px;font-weight:800;line-height:1.4}
.mh .t span{display:block;font-size:11.5px;color:var(--mu);line-height:1.5}
.mh .btn{font-size:20px;padding:0;width:48px;height:48px;border-radius:24px}
.cal{background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:10px 8px 8px}
.wds,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wds div{text-align:center;font-size:11.5px;font-weight:700;color:var(--mu);padding:4px 0}.wds .f{color:var(--rd)}
.grid{grid-auto-rows:66px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.d{position:relative;border:1.5px solid transparent;border-radius:14px;background:var(--bg);padding:4px 9px 5px;display:flex;flex-direction:column;justify-content:space-between;text-align:right;overflow:hidden;transition:transform .1s}
.d:active{transform:scale(.93)}
.d .tp{display:flex;justify-content:space-between;align-items:flex-start}
.d .n{font-size:19px;font-weight:700;line-height:1.25}
.d .mk{font-size:10px;color:var(--ac);line-height:1.4}
.d .bt{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:10px;color:var(--mu);line-height:1}.d .bt span{min-width:0}.d .bt .g{direction:ltr;opacity:.85}@media (max-width:360px){.d{padding:4px 7px 5px}.d .bt{gap:6px;font-size:9.5px}}
.d.r .n{color:var(--rd)}
.d.t{border-color:var(--ac)}.d.t .n{text-decoration:underline;text-decoration-color:var(--ac);text-decoration-thickness:3px;text-underline-offset:3px}
.d.s{background:var(--acb);border-color:var(--ac)}.d.s.r{background:var(--rdb);border-color:var(--rd)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:14px;margin:12px 0 0}
.card h1{font-size:20px;margin:10px 0 2px;font-weight:800}
.card h2{font-size:14px;margin:0 0 8px;color:var(--mu);font-weight:700}
.sub{font-size:13px;color:var(--mu)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.e{display:flex;gap:8px;align-items:flex-start;margin:8px 0;font-size:14px}
.tag{font-size:11px;border-radius:8px;padding:1px 8px;background:var(--rdb);color:var(--rd);white-space:nowrap;margin-top:2px}
.tag.u{background:var(--acb);color:var(--ac)}.tag.a{background:var(--acb);color:var(--ac);border:1px solid var(--ac)}.tag.w{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.dt{font-size:14px;line-height:2}.dt b{color:var(--mu);font-weight:400}
.note{border:1px solid var(--bd);border-radius:16px;padding:10px;margin-bottom:8px;background:var(--bg)}
.note h3{margin:0 0 4px;font-size:15px}.note p{margin:0 0 8px;white-space:pre-wrap;word-break:break-word;font-size:14px}
.note .row{justify-content:flex-start}
input.ti,textarea,select{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:11px;margin-bottom:8px;font-size:16px}
textarea{min-height:130px;resize:vertical}
.sl{width:auto}.row select.sl,.row input.ti{margin:0}
.btn:focus-visible,.d:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
details p{margin:6px 0 0;line-height:1.9}
.mt{width:100%;border-collapse:collapse;font-size:13px}.mt th,.mt td{border-bottom:1px solid var(--bd);padding:5px 3px;text-align:center}.mt th{color:var(--mu);font-weight:600;font-size:12px}.mt small{display:block;color:var(--mu);font-size:11px;direction:ltr}
.foot{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:14px;margin-top:12px;font-size:13px;color:var(--mu)}
.seg{display:flex;gap:4px;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:4px}
.seg button{flex:1;min-height:44px;border:0;background:none;border-radius:14px;color:var(--mu)}
.seg .on{background:var(--acb);color:var(--ac);font-weight:700}
.spic{aspect-ratio:2.87/1;margin-top:12px;border-radius:22px;border:1px solid var(--bd);background:center/cover no-repeat;position:relative}
.spic span{position:absolute;bottom:8px;right:8px;background:rgba(255,255,255,.9);color:#222;border-radius:999px;padding:2px 12px;font-size:12px;font-weight:700}
.credit{text-align:center;font-size:12px;color:var(--mu);margin:14px 6px 0;line-height:1.9}.credit b{color:var(--ac)}
.nav{display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 4px 8px}
.nav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--mu);min-height:58px}
.nav .ic{position:relative;width:60px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:18px;transition:background .2s}
.nav .on .ic{background:var(--acb)}.nav .on{color:var(--ac);font-weight:700}
.nav i{position:absolute;top:-3px;left:8px;font-style:normal;font-size:10px;background:var(--ac);color:var(--card);border-radius:9px;padding:0 5px;min-width:16px;line-height:16px;text-align:center}
.fab{position:absolute;left:16px;bottom:84px;z-index:6;width:56px;height:56px;border-radius:18px;border:0;background:var(--ac);color:#fff;font-size:28px;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.28)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .fab{color:#06201d}}
:root[data-theme="dark"] .fab{color:#06201d}
.scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;background:var(--card);border-radius:28px 28px 0 0;padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet:before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:var(--bd);margin:0 auto 12px}
.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.mg .btn{min-height:50px}.mg .on{background:var(--ac);border-color:var(--ac);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mg .on{color:#06201d}}
:root[data-theme="dark"] .mg .on{color:#06201d}
.lbx{position:fixed;inset:0;z-index:100;background:rgba(10,12,16,.88);display:flex;align-items:center;justify-content:center;padding:2vh 2vw}
.lbx img{max-height:90vh;max-width:96vw;object-fit:contain}
.lbx .btn{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));left:16px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

function tvDT(Y){let t;
 if(Y<1920){t=Y-1900;return -2.79+1.494119*t-0.0598939*t*t+0.0061966*t**3-0.000197*t**4}

function secHtml(a,cls,lab){return a.length?a.map(e=>`<div class="e"><span class="tag ${e.o?'':cls}">${e.o?'تعطیل رسمی':lab}</span><span>${esc(e.t)}</span></div>`).join(''):'<div style="color:var(--mu);font-size:14px">مناسبتی ثبت نشده است.</div>'}
function world(j){const[,m,d]=d2g(j);return GW[m+'/'+d]?GW[m+'/'+d].split('|'):[]}
function ancs(j){const[y,m,d]=d2j(j),a=[];if(JA[m+'/'+d])a.push(JA[m+'/'+d]);
 if(m==12){const n=mlen(y,12);if(d>=n-4)a.push('پنجه (اندرگاه)؛ پنج روز پایانی سال');
  if((j+2)%7===3&&j+7>j2d(y,12,n))a.push('شب چهارشنبه‌سوری (آخرین سه‌شنبه سال)')}
 return a}

function corr(sy,gy,hy){

 let a='',c='';
 for(let m=1;m<=12;m++){
  const s=j2d(sy,m,1),e=s+mlen(sy,m)-1;a+=row(m,JM[m-1],rg(1,s,e));
  const gs=g2d(gy,m,1),ge=(m<12?g2d(gy,m+1,1):g2d(gy+1,1,1))-1;c+=row(m,GM[m-1]+'<small>'+GE[m-1]+'</small>',rg(0,gs,ge));
 }
 return `<div class="sub" style="color:var(--mu);font-size:12px">عدد داخل پرانتز شماره ماه است. سال مبنای جدول‌ها سال روز انتخابی است.</div>`
  +tb('ماه‌های شمسی '+fa(sy)+' در تقویم میلادی','شمسی',a)
  +tb('ماه‌های میلادی '+fa(gy)+' در تقویم شمسی','میلادی',c)}
let cv={f:0,t:1,y:null,m:1,d:1,res:''};
function fromJ(c,j){return c==0?d2j(j):c==1?d2g(j):hij(j)}
function toJ(c,y,m,d){
 if(!Number.isInteger(y)||!Number.isInteger(d)||m<1||m>12||d<1)return null;
 if(c==0)return d>mlen(y,m)?null:j2d(y,m,d);
 if(c==1){const j=g2d(y,m,d),g=d2g(j);return g[0]==y&&g[1]==m&&g[2]==d?j:null}
 if(d>30)return null;
 const e=d+Math.ceil(29.5*(m-1))+(y-1)*354+Math.floor((3+11*y)/30)+1948439;
 for(let k=-3;k<=3;k++){const h=hij(e+k);if(h[0]==y&&h[1]==m&&h[2]==d)return e+k}
 return null}

  renderConv()};
}
